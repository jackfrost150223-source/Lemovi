name: Build Lemovi APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build TV and Mobile debug APKs
        run: gradle assembleTvDebug assembleMobileDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lemovi-TV-and-Mobile-APKs
          path: |
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          if-no-files-found: error
